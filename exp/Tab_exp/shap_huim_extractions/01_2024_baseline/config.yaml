experiment:
  name: "01_2024_baseline_shap_huim"
  description: >
    SHAP value extraction + HUIM pattern mining on 2024 flight data.
    Produces delay-driver and delay-protector pattern CSVs used by model ablations.

data:
  year: 2024
  file: "Flight_tab_2024.csv"
  yaml_info: "data_info_2024.yaml"
  train_days_max: 9      # FL_DAY <= 9  -> train (used for SHAP fitting)
  val_days_max: 12
  sample_frac: 0.1       # fraction of training data used for SHAP computation

shap:
  model: "MLP"           # base model for SHAP value extraction
  bg_samples: 200        # background samples for SHAP KernelExplainer
  test_samples: 1000     # number of test instances to explain

huim:
  n_bins: 5
  shap_scale: 10000          # SHAP float → integer scale factor for PAMI
  min_util_percentile: 90    # Nth percentile of transaction utilities as minUtil threshold

outputs:
  csvs_dir: "csvs"       # relative to this experiment folder
  txt_dir: "txt"
  figures_dir: "figures"

paths:
  data_dir: "C:/Users/user/Desktop/tez/git/Delay-data/Datasets/Aeolus/Flight_Tab/Tab"
