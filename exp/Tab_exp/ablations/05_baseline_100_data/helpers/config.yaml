experiment:
  name: "export_raw_for_llm"
  description: >
    Export a small set of RAW (un-encoded) flight rows for LLM prompting.
    No model training. Samples N rows from the train-day split, keeps the
    original human-readable values (carrier/airport codes, scheduled times,
    weather, coordinates) and appends raw ARR_DELAY + a binary DELAYED label.

data:
  year: 2020
  file: "Flight_tab_2020.csv"
  yaml_info: "data_info_2020.yaml"
  train_days_max: 9          # sample only from FL_DAY <= 9 (train days)

export:
  n_rows: 100                # go lower/higher here; 43% base rate stays balanced
  random_state: 42
  target_col: "ARR_DELAY"
  delay_threshold: 15        # DELAYED = (|ARR_DELAY| > 15)

features:
  # dropped: FLIGHTS (always 1), FL_YEAR (always 2020), FL_MONTH (per project rules).
  # DEP_DELAY is intentionally NOT exported as a feature — it leaks the target.
  exclude_cols: ["FLIGHTS", "FL_YEAR", "FL_MONTH"]

output:
  csv: "../output/llm_sample_raw.csv"

# ── LLM-Select (LLM-Score) feature selection ─────────────────────────────────
# Method from taekb/llm-select (Jeong et al., TMLR 2025). LLM-Score asks the LLM
# for an independent 0-1 importance score per feature. We run two prompt variants
# and compare them:
#   - data_free:     feature name + description + task context only (paper-faithful)
#   - data_informed: same, plus the 100 sample rows from llm_sample_raw.csv in-context
# All paths below are relative to this config file's directory (helpers/), matching
# the existing `output.csv: "../output/..."` convention.
llm_select:
  method: "llm_score"
  model: "qwen2.5:7b"
  ollama_host: "http://localhost:11434"
  variants: ["data_free", "data_informed"]
  n_repeats: 3                 # queries per feature; scores aggregated as mean +/- std
  temperature: 0.5
  request_timeout: 120         # seconds per Ollama call
  max_data_rows: 100           # sample rows injected for the data_informed variant
  target_description: "whether a US domestic flight is delayed, defined as absolute arrival delay |ARR_DELAY| > 15 minutes"
  feature_desc_file: "feature_descriptions.yaml"   # in helpers/
  sample_file: "../output/llm_sample_raw.csv"
  out_dir: "../output"

paths:
  data_dir: "C:/Users/user/Desktop/tez/git/Delay-data/Datasets/Aeolus/Flight_Tab/Tab"
