experiment:
  name: "huim_only"
  description: >
    Only HUIM binary pattern columns — no original features at all.
    Tests whether mined combinatorial patterns alone can predict delay.

data:
  year: 2020
  file: "Flight_tab_2020.csv"
  yaml_info: "data_info_2020.yaml"
  train_days_max: 9
  val_days_max: 12

training:
  phase1_frac: 0.1
  phase1_val_mode: "explicit"
  phase2_frac: 0.1
  val_frac: 0.1

  max_epochs: 100
  patience_phase1: 5
  patience_phase2: 5
  batch_size: 2048
  num_workers: 0
  precision: "16-mixed"
  accelerator: "gpu"

  n_iter: 10
  cv: 3
  d_model_options: [64, 128, 256]
  n_layers_options: [2, 6, 10]
  lr_options: [1.0e-5, 1.0e-4, 1.0e-3]

features:
  mode: "huim_only"
  top_drivers_n: 20
  top_protectors_n: 20
  n_bins: 5
  drivers_file: "../../shap_huim_extractions/01_2024_baseline/csvs/huim_delay_drivers.csv"
  protectors_file: "../../shap_huim_extractions/01_2024_baseline/csvs/huim_delay_protectors.csv"
  exclude_cols: []

paths:
  data_dir: "C:/Users/user/Desktop/tez/git/Delay-data/Datasets/Aeolus/Flight_Tab/Tab"
